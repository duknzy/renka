<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#242633"/>
      <stop offset="100%" stop-color="#050608"/>
    </radialGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#a1a1aa"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGlow)"/>
  <rect width="508" height="508" x="2" y="2" rx="110" fill="none" stroke="#ffffff" stroke-width="2" stroke-opacity="0.15"/>

  <!-- Tilted Background Card -->
  <rect x="130" y="110" width="252" height="310" rx="36" fill="#181a24" stroke="#ffffff" stroke-width="2" stroke-opacity="0.2" transform="rotate(-8 256 265)" filter="url(#shadow)"/>

  <!-- Main Front Card -->
  <rect x="130" y="105" width="252" height="310" rx="36" fill="#0d0e14" stroke="#ffffff" stroke-width="2.5" stroke-opacity="0.3" transform="rotate(4 256 260)" filter="url(#shadow)"/>

  <!-- SRS Monogram -->
  <g transform="rotate(4 256 260)">
    <circle cx="256" cy="205" r="44" fill="#ffffff" fill-opacity="0.08"/>
    <!-- Leitner 3-layers mark -->
    <path d="M 230 190 L 256 175 L 282 190 L 256 205 Z" fill="#ffffff" fill-opacity="0.95"/>
    <path d="M 230 205 L 256 190 L 282 205 L 256 220 Z" fill="#ffffff" fill-opacity="0.6"/>
    <path d="M 230 220 L 256 205 L 282 220 L 256 235 Z" fill="#ffffff" fill-opacity="0.3"/>

    <text x="256" y="295" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="900" fill="url(#cardGrad)" text-anchor="middle" letter-spacing="4">SRS</text>
    <text x="256" y="325" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" fill="#71717a" text-anchor="middle" letter-spacing="6">FLASHCARD</text>
  </g>
</svg>
